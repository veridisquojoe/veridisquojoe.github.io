<!-- Portfolio Chat Widget — talks directly to n8n webhook -->
<style>
  #pf-chat-btn {
    position: fixed; bottom: 24px; right: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: #424658; border: none; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 9999; color: white; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
  }
  #pf-chat-btn:hover { transform: scale(1.08); }
  #pf-chat-win {
    position: fixed; bottom: 92px; right: 24px;
    width: 340px; height: 460px;
    background: #fff; border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    z-index: 9998; display: none; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px; overflow: hidden;
  }
  #pf-chat-win.open { display: flex; }
  #pf-chat-head {
    background: #424658; color: #fff;
    padding: 14px 16px; font-weight: 600;
  }
  #pf-chat-head span { display: block; font-size: 11px; font-weight: 400; opacity: 0.75; margin-top: 2px; }
  #pf-chat-msgs {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .pf-msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; line-height: 1.45; }
  .pf-msg.bot { background: #f0f1f5; align-self: flex-start; border-bottom-left-radius: 2px; }
  .pf-msg.user { background: #424658; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
  .pf-msg.typing { color: #999; font-style: italic; }
  #pf-chat-form {
    display: flex; border-top: 1px solid #e8e8e8; padding: 10px;
  }
  #pf-chat-input {
    flex: 1; border: 1px solid #ddd; border-radius: 20px;
    padding: 8px 14px; outline: none; font-size: 13px;
    font-family: inherit;
  }
  #pf-chat-send {
    margin-left: 8px; background: #424658; color: #fff;
    border: none; border-radius: 20px; padding: 8px 16px;
    cursor: pointer; font-size: 13px; font-family: inherit;
  }
  #pf-chat-send:hover { background: #5a5f7a; }
</style>

<button id="pf-chat-btn" title="Ask about Joe's work">💬</button>

<div id="pf-chat-win">
  <div id="pf-chat-head">
    Ask about Joe's work
    <span>AI-powered portfolio assistant</span>
  </div>
  <div id="pf-chat-msgs">
    <div class="pf-msg bot">Hi! I'm Joe's portfolio assistant. Ask me about any of his projects, skills, or data science work.</div>
  </div>
  <form id="pf-chat-form">
    <input id="pf-chat-input" type="text" placeholder="Ask about a project or skill..." autocomplete="off" />
    <button id="pf-chat-send" type="submit">Send</button>
  </form>
</div>

<script>
(function() {
  var WEBHOOK = 'https://eldredgemc2.app.n8n.cloud/webhook/7d6b6609-3718-40a8-8e0b-d6419580517c/chat';
  var sessionId = 'pf-' + Math.random().toString(36).slice(2, 10);
  var btn = document.getElementById('pf-chat-btn');
  var win = document.getElementById('pf-chat-win');
  var msgs = document.getElementById('pf-chat-msgs');
  var form = document.getElementById('pf-chat-form');
  var input = document.getElementById('pf-chat-input');

  btn.addEventListener('click', function() {
    win.classList.toggle('open');
    if (win.classList.contains('open')) input.focus();
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    addMsg(text, 'user');
    input.value = '';
    var typing = addMsg('Thinking...', 'bot typing');

    fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chatInput: text, sessionId: sessionId })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      typing.remove();
      var reply = (data.output || data.text || data.response || JSON.stringify(data));
      addMsg(reply, 'bot');
    })
    .catch(function() {
      typing.remove();
      addMsg("Sorry, I couldn't reach the server. Try again in a moment.", 'bot');
    });
  });

  function addMsg(text, cls) {
    var el = document.createElement('div');
    el.className = 'pf-msg ' + cls;
    el.textContent = text;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
  }
})();
</script>
